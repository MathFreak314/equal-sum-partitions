[package]
name = "esp"
version = "0.1.0"
edition = "2024"
description = "Counts partitions of 1..n*k into n equal-sum blocks of size k (OEIS A203986 / A321230)"
authors = ["Daniel Branscombe <daniel.branscombe@gmail.com>"]
license = "MIT"
repository = "https://github.com/MathFreak314/equal-sum-partitions"

[dependencies]
rayon = "1.12.0"
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true
